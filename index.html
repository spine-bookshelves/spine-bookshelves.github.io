<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스파인</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --bg:#FAFAF8; --ink:#1B1F1C; --sub:#7D817D; --line:#E4E3DE; --green:#1E3A2C; --surface:#F2F2EF; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 15.5px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
.wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
header a.home { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.mark { width: 30px; height: 23px; fill: var(--green); }
.word { font-weight: 700; font-size: 21px; letter-spacing: -.5px; }
nav { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 32px; font-size: 14px; }
nav a { color: var(--sub); text-decoration: none; }
nav a[aria-current] { color: var(--ink); font-weight: 600; }
h1 { font-size: 26px; line-height: 1.35; letter-spacing: -.5px; margin: 0 0 18px; }
h2 { font-size: 18px; margin: 40px 0 10px; letter-spacing: -.3px; }
h3 { font-size: 16px; margin: 28px 0 8px; }
p, ul, ol { margin: 0 0 14px; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
a { color: var(--green); }
strong { font-weight: 600; }
code { font-size: .9em; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
.table { overflow-x: auto; margin: 0 0 18px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; }
th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--sub); font-size: 13px; }
footer { margin-top: 48px; font-size: 13px; color: var(--sub); }
.links { list-style: none; padding: 0; margin: 24px 0 0; }
.links li { border-top: 1px solid var(--line); margin: 0; }
.links li:last-child { border-bottom: 1px solid var(--line); }
.links a { display: block; padding: 14px 2px; color: var(--ink); text-decoration: none; font-weight: 500; }
</style>
</head>
